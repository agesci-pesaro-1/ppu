# Alla chiusura (o al merge) di una pull request elimina Worker e D1 della preview.
name: Chiusura preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  elimina:
    name: Elimina la preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOME: ppu-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Verifica i prerequisiti
        id: prerequisiti
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Segreti Cloudflare mancanti: niente da eliminare."
            echo "attiva=false" >> "$GITHUB_OUTPUT"
          else
            echo "attiva=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Elimina Worker e D1
        working-directory: packages/worker
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # Solo risorse con il prefisso della preview: mai beta o produzione.
          case "$NOME" in ppu-preview-pr-*) ;; *) echo "Nome inatteso: $NOME"; exit 1 ;; esac
          export CI=1
          pnpm exec wrangler delete "$NOME" --force || echo "Worker $NOME già assente."
          if pnpm exec wrangler d1 list --json | jq -e --arg n "$NOME" '.[] | select(.name == $n)' >/dev/null; then
            pnpm exec wrangler d1 delete "$NOME" --skip-confirmation
          else
            echo "D1 $NOME già assente."
          fi
