# Rilascio: al merge su main migrazioni sul D1 di produzione e deploy della beta;
# la produzione si promuove a mano (environment "produzione" con approvazione).
# Deploy solo da qui, mai da una macchina locale.
name: Rilascio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente da pubblicare
        type: choice
        options: [produzione, beta]
        default: produzione

permissions:
  contents: read

concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  pubblica:
    name: Pubblica ${{ github.event_name == 'push' && 'beta' || inputs.ambiente }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'beta' || inputs.ambiente }}
    env:
      AMBIENTE: ${{ github.event_name == 'push' && 'beta' || inputs.ambiente }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verifica i prerequisiti
        id: prerequisiti
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Segreti Cloudflare mancanti: rilascio saltato (docs/installazione/pipeline.md)."
            echo "attiva=false" >> "$GITHUB_OUTPUT"
          else
            echo "attiva=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Installa e verifica
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm typecheck
          pnpm test

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Genera la configurazione
        env:
          PPU_AMBIENTE: ${{ env.AMBIENTE }}
          PPU_D1_NOME: ${{ vars.PPU_D1_NOME }}
          PPU_D1_ID: ${{ vars.PPU_D1_ID }}
          PPU_KV_OAUTH_ID: ${{ vars.PPU_KV_OAUTH_ID }}
          PPU_DOMINIO: ${{ vars.PPU_DOMINIO }}
          PPU_NOME_GRUPPO: ${{ vars.PPU_NOME_GRUPPO }}
          PPU_ACCESS_TEAM_DOMAIN: ${{ vars.PPU_ACCESS_TEAM_DOMAIN }}
          PPU_ACCESS_AUD: ${{ vars.PPU_ACCESS_AUD }}
          PPU_ROUTE: ${{ vars.PPU_ROUTE }}
        run: node scripts/configura-wrangler.ts

      # Difesa in profondità, oltre a src/config.ts e al generatore.
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Blocca la modalità di test fuori dalla preview
        working-directory: packages/worker
        run: |
          if grep -q 'MODALITA_TEST' wrangler.generato.json; then
            echo "::error::La configurazione di $AMBIENTE contiene MODALITA_TEST: deploy bloccato."
            exit 1
          fi

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Migrazioni sul D1 di produzione
        working-directory: packages/worker
        env:
          CI: "1"
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.generato.json --env "$AMBIENTE"

      # Il seed base è idempotente (ON CONFLICT DO NOTHING): riapplicarlo non
      # tocca unità rinominate o disattivate dal webmaster.
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Seed base sul D1 di produzione
        working-directory: packages/worker
        env:
          CI: "1"
        run: |
          for f in ../../seed/base/*.sql; do
            pnpm exec wrangler d1 execute DB --remote --file "$f" -c wrangler.generato.json --env "$AMBIENTE"
          done

      # Primo webmaster: senza almeno un webmaster nessuno può assegnare ruoli
      # dall'MCP admin. Agisce solo se in utenti non c'è ancora nessun webmaster.
      - if: steps.prerequisiti.outputs.attiva == 'true' && vars.PPU_WEBMASTER_INIZIALE != ''
        name: Primo webmaster (solo se assente)
        working-directory: packages/worker
        env:
          CI: "1"
          EMAIL: ${{ vars.PPU_WEBMASTER_INIZIALE }}
          DOMINIO: ${{ vars.PPU_DOMINIO }}
        run: |
          email="$(printf '%s' "$EMAIL" | tr '[:upper:]' '[:lower:]')"
          dominio="$(printf '%s' "$DOMINIO" | tr '[:upper:]' '[:lower:]')"
          if ! printf '%s' "$email" | grep -Eq '^[a-z0-9._+-]+@[a-z0-9.-]+$' || [ "${email##*@}" != "$dominio" ]; then
            echo "::error::PPU_WEBMASTER_INIZIALE non valida o fuori dal dominio."
            exit 1
          fi
          pnpm exec wrangler d1 execute DB --remote -c wrangler.generato.json --env "$AMBIENTE" --command "
            INSERT INTO utenti (email, webmaster)
              SELECT '$email', 1 WHERE NOT EXISTS (SELECT 1 FROM utenti WHERE webmaster = 1)
              ON CONFLICT (email) DO UPDATE SET webmaster = 1;
            INSERT INTO modifiche (operazione, autore_email, canale, entita, entita_id, campo, valore_dopo)
              SELECT 'primo-webmaster', 'sistema', 'sistema', 'utenti', '$email', 'webmaster', '1'
              WHERE changes() > 0;"

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Build della PWA
        run: pnpm --filter @ppu/pwa build

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Pubblica il Worker
        working-directory: packages/worker
        run: |
          pnpm exec wrangler deploy -c wrangler.generato.json --env "$AMBIENTE" \
            --message "${GITHUB_SHA::7} da GitHub Actions"

      # Segreti del login Google per l'MCP. Dopo il deploy: il Worker deve esistere.
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Segreti del login Google
        working-directory: packages/worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::notice::GOOGLE_CLIENT_ID o GOOGLE_CLIENT_SECRET mancanti: login MCP non disponibile."
            exit 0
          fi
          jq -n --arg id "$GOOGLE_CLIENT_ID" --arg s "$GOOGLE_CLIENT_SECRET" \
            '{GOOGLE_CLIENT_ID: $id, GOOGLE_CLIENT_SECRET: $s}' \
            | pnpm exec wrangler secret bulk -c wrangler.generato.json --env "$AMBIENTE"
