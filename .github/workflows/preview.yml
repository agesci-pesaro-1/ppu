# Preview per ogni pull request: D1 separato con seed demo, Worker con identità
# simulata, test E2E. Si salta (con un avviso) senza segreti Cloudflare o per le
# pull request da fork, che non ricevono segreti.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview ed E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOME: ppu-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Verifica i prerequisiti
        id: prerequisiti
        env:
          DA_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$DA_FORK" = "true" ]; then
            echo "::notice::Pull request da fork: preview saltata (nessun segreto disponibile)."
            echo "attiva=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID mancanti: preview saltata (docs/installazione/pipeline.md)."
            echo "attiva=false" >> "$GITHUB_OUTPUT"
          else
            echo "attiva=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.prerequisiti.outputs.attiva == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Installa le dipendenze
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Crea il D1 della preview (se non esiste)
        id: d1
        working-directory: packages/worker
        run: |
          id="$(pnpm exec wrangler d1 list --json | jq -r --arg n "$NOME" '.[] | select(.name == $n) | .uuid')"
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$NOME" --jurisdiction eu
            id="$(pnpm exec wrangler d1 list --json | jq -r --arg n "$NOME" '.[] | select(.name == $n) | .uuid')"
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Un solo KV per tutte le preview: l'OAuth in preview è secondario
      # (si usa l'identità simulata) e il namespace non contiene dati.
      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: KV OAuth delle preview (se non esiste)
        id: kv
        working-directory: packages/worker
        run: |
          cerca() { pnpm exec wrangler kv namespace list | jq -r '.[] | select(.title == "ppu-preview-oauth" or (.title | endswith("-ppu-preview-oauth"))) | .id' | head -1; }
          id="$(cerca)"
          if [ -z "$id" ]; then
            pnpm exec wrangler kv namespace create ppu-preview-oauth
            id="$(cerca)"
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Genera la configurazione
        env:
          PPU_AMBIENTE: preview
          PPU_D1_NOME: ${{ env.NOME }}
          PPU_D1_ID: ${{ steps.d1.outputs.id }}
          PPU_KV_OAUTH_ID: ${{ steps.kv.outputs.id }}
          PPU_NOME_WORKER: ${{ env.NOME }}
        run: node scripts/configura-wrangler.ts

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Migrazioni e seed
        working-directory: packages/worker
        env:
          CI: "1"
        run: |
          w() { pnpm exec wrangler "$@" -c wrangler.generato.json --env preview; }
          w d1 migrations apply DB --remote
          for f in ../../seed/base/*.sql; do w d1 execute DB --remote --file "$f"; done
          # Il seed demo usa id fissi: si applica solo a un database vuoto.
          n="$(w d1 execute DB --remote --json --command 'SELECT count(*) AS n FROM associati' | jq -r '.[0].results[0].n')"
          if [ "$n" = "0" ]; then
            for f in ../../seed/demo/*.sql; do w d1 execute DB --remote --file "$f"; done
          else
            echo "Seed demo già presente ($n associati)."
          fi

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Build della PWA
        run: pnpm --filter @ppu/pwa build

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Pubblica il Worker
        id: deploy
        working-directory: packages/worker
        run: |
          pnpm exec wrangler deploy -c wrangler.generato.json --env preview | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Commenta l'indirizzo sulla pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const segno = '<!-- ppu-preview -->';
            const corpo = `${segno}\n**Preview:** ${process.env.URL}\n\nApri l'indirizzo dal telefono e scegli un ruolo: solo dati inventati del seed demo (utenti su example.org). Per le API l'identità si simula con l'header \`X-Ppu-Utente-Test\`.\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const commenti = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const esistente = commenti.find((c) => c.body?.includes(segno));
            if (esistente) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: esistente.id, body: corpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: corpo });
            }

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Browser per i test E2E
        run: pnpm --filter @ppu/e2e exec playwright install --with-deps chromium

      - if: steps.prerequisiti.outputs.attiva == 'true'
        name: Test E2E sulla preview
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          CI: "1"
        run: pnpm --filter @ppu/e2e e2e
