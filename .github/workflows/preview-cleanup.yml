# When a pull request is closed (or merged), deletes the preview's Worker and D1.
name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete the preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ppu-preview-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check prerequisites
        id: prerequisites
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets missing: nothing to delete."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.prerequisites.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.prerequisites.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.prerequisites.outputs.enabled == 'true'
        name: Delete Worker and D1
        working-directory: packages/worker
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # Only resources with the preview prefix: never beta or production.
          case "$NAME" in ppu-preview-pr-*) ;; *) echo "Unexpected name: $NAME"; exit 1 ;; esac
          export CI=1
          pnpm exec wrangler delete "$NAME" --force || echo "Worker $NAME already gone."
          if pnpm exec wrangler d1 list --json | jq -e --arg n "$NAME" '.[] | select(.name == $n)' >/dev/null; then
            pnpm exec wrangler d1 delete "$NAME" --skip-confirmation
          else
            echo "D1 $NAME already gone."
          fi
